app:
  name: Legit

auth:
  defaultRole: viewer
  admins:
    emails:
      - admin@example.com
    domains: []
  providers:
    # Configure OAuth/OIDC provider credentials with env vars:
    # AUTH_MICROSOFT_ENTRA_ID_ID / AUTH_MICROSOFT_ENTRA_ID_SECRET / AUTH_MICROSOFT_ENTRA_ID_ISSUER
    # AUTH_GITHUB_ID / AUTH_GITHUB_SECRET
    # AUTH_GITLAB_ID / AUTH_GITLAB_SECRET / optional AUTH_GITLAB_ISSUER
    # AUTH_OIDC_ID / AUTH_OIDC_SECRET / AUTH_OIDC_ISSUER / optional AUTH_OIDC_NAME
    # LDAP is supported through an OIDC bridge such as Keycloak, Authentik, Authelia, or Dex.
    # Direct LDAP bind is intentionally not implemented.

ai:
  enabled: false
  baseUrlEnv: AI_BASE_URL
  apiKeyEnv: AI_API_KEY
  defaultModel: gpt-4o
  maxContextTokens: 150000
  allowAnonymous: false

sync:
  intervalSeconds: 120
  pullOnStartup: true
  reindexOnChange: true

repos:
  - id: research
    slug: research
    name: Research Wiki
    provider: gitlab
    repoUrl: https://gitlab.example.com/group/research
    defaultBranch: main
    docsPath: docs
    visibility: private
    commit:
      mode: merge-request
      targetBranch: main
      branchPrefix: legit/
