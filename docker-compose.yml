services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8021:8000"
    env_file:
      - .env
    volumes:
      - docs-repo:/app/docs-repo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  docs-repo:
