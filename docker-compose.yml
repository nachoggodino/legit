services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      LEGIT_CONFIG_PATH: /config/legit.yaml
      LEGIT_DATABASE_PATH: /data/legit.db
      LEGIT_REPOS_ROOT: /data/repos
      LEGIT_LOCKS_ROOT: /data/locks
      LEGIT_DISABLE_SYNC_SCHEDULER: "false"
    volumes:
      - legit-data:/data
      - ./config/legit.yaml:/config/legit.yaml:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3000/api/health'),fetch('http://127.0.0.1:3000/api/ready')]).then(([health,ready])=>process.exit(health.ok&&ready.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

volumes:
  legit-data:
