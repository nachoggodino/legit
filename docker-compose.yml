services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      LEGIT_CONFIG_PATH: /config/legit.yaml
      LEGIT_DATABASE_PATH: /data/legit.db
      LEGIT_REPOS_ROOT: /data/repos
    volumes:
      - legit-data:/data
      - ./legit.example.yaml:/config/legit.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

volumes:
  legit-data:
